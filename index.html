<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎯 Hit28 - Cloud NFL Season Pool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="flex flex-col sm:flex-row items-center justify-between bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-2 border border-emerald-500/20">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Live Cloud Sync
        </div>
        <h1 class="text-3xl font-black text-white flex items-center gap-2">
          🎯 HIT 28
        </h1>
        <p class="text-xs text-slate-400" id="leagueTitleDisplay">2026 Season Pool</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-[9px] font-bold text-slate-400 uppercase">2026 Week</label>
          <select id="weekSelector" onchange="changeWeek(this.value)" class="bg-slate-950 border border-slate-800 text-amber-400 font-bold text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-amber-500"></select>
        </div>

        <div class="bg-slate-950 px-4 py-2 rounded-xl border border-slate-800 text-right">
          <div class="text-[9px] font-bold uppercase text-slate-400">Total Pot</div>
          <div id="potDisplay" class="text-xl font-black text-amber-400">$0</div>
        </div>

        <button onclick="handleAuthClick()" id="authBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold px-3 py-3 rounded-xl border border-slate-700 transition">
          🔒 Commish Login
        </button>
      </div>
    </header>

    <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 flex flex-col sm:flex-row items-center justify-between text-xs gap-2">
      <span class="text-amber-300 font-medium">📋 League Code: <strong id="leagueCodeBadge" class="text-white font-mono bg-slate-900 px-2 py-1 rounded border border-amber-500/30">H28-DEMO</strong></span>
      <div class="flex gap-2">
        <button onclick="copyLeagueLink()" id="copyLinkBtn" class="bg-amber-500 text-slate-950 px-3 py-1.5 rounded-lg font-bold hover:bg-amber-400 transition">
          Copy Link
        </button>
        <button onclick="copyWeeklyRosterText()" id="copyChatBtn" class="bg-slate-800 text-slate-200 px-3 py-1.5 rounded-lg font-bold hover:bg-slate-700 transition">
          Copy iMessage
        </button>
      </div>
    </div>

    <div id="targetHitContainer" class="hidden space-y-3">
      <h2 class="text-sm font-bold text-emerald-400 tracking-wide uppercase flex items-center gap-2">
        🏆 TARGET HIT (28 PTS) - WINNER!
      </h2>
      <div id="targetHitGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
    </div>

    <div class="space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-amber-400 tracking-wide uppercase">🔥 IN THE SWEAT ZONE</h2>
        <span id="lastUpdated" class="text-[10px] text-slate-500 font-mono"></span>
      </div>
      <div id="sweatGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
    </div>

    <div id="byeContainer" class="space-y-2 pt-2 border-t border-slate-800">
      <h2 class="text-xs font-bold text-slate-400 tracking-wide uppercase">🏖️ ON BYE THIS WEEK (2026)</h2>
      <div id="byeGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
    </div>

    <div class="space-y-3 pt-2 border-t border-slate-800/80">
      <h2 class="text-xs font-bold text-rose-400 tracking-wide uppercase">💀 BUSTED (&gt;28 PTS)</h2>
      <div id="bustedGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-2 opacity-60"></div>
    </div>
  </div>

  <div id="authModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-sm p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-black text-white">🔒 Commish Cloud Access</h3>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Email</label>
          <input id="authEmail" type="email" placeholder="coach@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white" />
        </div>
        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Password</label>
          <input id="authPassword" type="password" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white" />
        </div>
        <div class="flex gap-2 pt-2">
          <button onclick="handleLogin()" class="w-1/2 bg-amber-500 text-slate-950 font-black py-2.5 rounded-xl text-xs transition">Log In</button>
          <button onclick="handleSignUp()" class="w-1/2 bg-slate-800 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition">Create Account</button>
        </div>
      </div>
    </div>
  </div>

  <div id="commishDashboardModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-6 space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-black text-white">⚙️ Cloud League Manager</h3>
        <button onclick="closeDashboardModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>
      
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">League Name</label>
            <input id="cfgLeagueName" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" />
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Weekly Entry Fee ($)</label>
            <input id="cfgWeeklyDues" type="number" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-mono" />
          </div>
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Player Names (1 per line - Locked for Season)</label>
          <textarea id="cfgPlayers" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white font-mono" placeholder="Dave M.&#10;Sarah T.&#10;Christian K.&#10;Coach K."></textarea>
        </div>

        <button onclick="saveAndSyncLeague()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black py-3 rounded-xl text-xs transition">
          ☁️ Save & Sync Season Schedule to Supabase
        </button>

        <button onclick="handleSignOut()" class="w-full bg-rose-950/40 text-rose-400 border border-rose-900 hover:bg-rose-900/50 py-2.5 rounded-xl text-xs font-bold transition">
          Sign Out
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zpxwqgfmgzlgdcpsbzsj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_JnvUHSZbaimRXUJ8L-1oQA_9zieHbIo';
    
    // Initialize Supabase with clean auth options (prevents auto anonymous warning)
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        autoRefreshToken: false,
        persistSession: true,
        detectSessionInUrl: false
      }
    });

    const NFL_TEAMS = ['ARI','ATL','BAL','BUF','CAR','CHI','CIN','CLE','DAL','DEN','DET','GB','HOU','IND','JAX','KC','LV','LAC','LAR','MIA','MIN','NE','NO','NYG','NYJ','PHI','PIT','SF','SEA','TB','TEN','WAS'];
    
    let currentLeague = {
      league_code: 'DEMO26',
      name: 'Sunday Sweat 28 Club',
      weekly_dues: 320,
      rollover_pot: 0,
      active_week: 1,
      players: ['Dave M.', 'Sarah T.', 'Christian K.', 'Alex R.'],
      schedule: {}
    };

    let currentUser = null;
    let currentWeekActiveTeams = new Set();
    let celebratedTeams = new Set();

    async function init() {
      const sel = document.getElementById('weekSelector');
      sel.innerHTML = '';
      for(let w = 1; w <= 18; w++) {
        const opt = document.createElement('option');
        opt.value = w;
        opt.textContent = `Week ${w}`;
        sel.appendChild(opt);
      }

      // Safe user session check
      try {
        const sessionStr = localStorage.getItem('hit28_user_session');
        if (sessionStr) {
          currentUser = JSON.parse(sessionStr);
        }
      } catch (e) {
        currentUser = null;
      }
      updateAuthUI();

      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        await loadLeagueFromCloud(code);
      } else if (currentUser) {
        await loadCommissionerLeague(currentUser.id);
      } else {
        if (!currentLeague.schedule || !Object.keys(currentLeague.schedule).length) {
          buildSeasonSchedule();
        }
      }

      sel.value = currentLeague.active_week || 1;
      updateUI();
      fetchLiveScores();
    }

    async function loadLeagueFromCloud(code) {
      try {
        const { data, error } = await db.from('leagues').select('*').eq('league_code', code).single();
        if (data && !error) {
          currentLeague = data;
          updateUI();
        }
      } catch (e) {
        console.error('Load league error:', e);
      }
    }

    async function loadCommissionerLeague(userId) {
      try {
        const { data } = await db.from('leagues').select('*').eq('user_id', userId).limit(1).single();
        if (data) {
          currentLeague = data;
          updateUI();
        }
      } catch (e) {
        console.error('Load commish error:', e);
      }
    }

    function updateAuthUI() {
      const btn = document.getElementById('authBtn');
      if (currentUser) {
        btn.textContent = '⚙️ Manage League';
        btn.onclick = openDashboard;
      } else {
        btn.textContent = '🔒 Commish Login';
        btn.onclick = openAuthModal;
      }
    }

    function updateUI() {
      document.getElementById('leagueTitleDisplay').textContent = currentLeague.name;
      document.getElementById('leagueCodeBadge').textContent = currentLeague.league_code;
      const totalPot = Number(currentLeague.weekly_dues) + Number(currentLeague.rollover_pot);
      document.getElementById('potDisplay').textContent = `$${totalPot}`;
    }

    function changeWeek(w) {
      currentLeague.active_week = parseInt(w, 10);
      fetchLiveScores();
    }

    function buildSeasonSchedule() {
      currentLeague.schedule = {};
      const numPlayers = currentLeague.players.length;
      if (!numPlayers) return;

      for (let w = 1; w <= 18; w++) {
        currentLeague.schedule[w] = {};
        const shuffled = [...NFL_TEAMS].sort(() => Math.random() - 0.5);
        shuffled.forEach((team, idx) => {
          currentLeague.schedule[w][team] = currentLeague.players[(idx + (w * 3)) % numPlayers];
        });
      }
    }

    function handleAuthClick() {
      if (currentUser) openDashboard();
      else openAuthModal();
    }

    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
    
    async function handleLogin() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if (!email || !password) return alert('Enter email and password');

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) return alert(error.message);
      
      currentUser = data.user;
      localStorage.setItem('hit28_user_session', JSON.stringify(currentUser));
      closeAuthModal();
      updateAuthUI();
      await loadCommissionerLeague(currentUser.id);
    }

    async function handleSignUp() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if (!email || !password) return alert('Enter email and password');

      const { data, error } = await db.auth.signUp({ email, password });
      if (error) return alert(error.message);
      
      if (data.user) {
        currentUser = data.user;
        localStorage.setItem('hit28_user_session', JSON.stringify(currentUser));
        alert('Account created! Opening your league manager.');
        closeAuthModal();
        updateAuthUI();
        openDashboard();
      }
    }

    async function handleSignOut() {
      await db.auth.signOut();
      currentUser = null;
      localStorage.removeItem('hit28_user_session');
      closeDashboardModal();
      updateAuthUI();
      window.location.reload();
    }

    function openDashboard() {
      document.getElementById('cfgLeagueName').value = currentLeague.name;
      document.getElementById('cfgWeeklyDues').value = currentLeague.weekly_dues;
      document.getElementById('cfgPlayers').value = currentLeague.players.join('\n');
      document.getElementById('commishDashboardModal').classList.remove('hidden');
    }
    function closeDashboardModal() { document.getElementById('commishDashboardModal').classList.add('hidden'); }

    async function saveAndSyncLeague() {
      if (!currentUser) return alert('Please sign in first');

      const name = document.getElementById('cfgLeagueName').value.trim() || 'Sunday Sweat Club';
      const dues = parseInt(document.getElementById('cfgWeeklyDues').value, 10) || 320;
      const players = document.getElementById('cfgPlayers').value.split('\n').map(n => n.trim()).filter(Boolean);

      if (!players.length) return alert('Enter at least 1 player name');

      currentLeague.name = name;
      currentLeague.weekly_dues = dues;
      currentLeague.players = players;
      if (!currentLeague.league_code || currentLeague.league_code === 'DEMO26') {
        currentLeague.league_code = 'H28-' + Math.random().toString(36).substring(2, 7).toUpperCase();
      }

      buildSeasonSchedule();

      const payload = {
        user_id: currentUser.id,
        league_code: currentLeague.league_code,
        name: currentLeague.name,
        weekly_dues: currentLeague.weekly_dues,
        rollover_pot: currentLeague.rollover_pot || 0,
        active_week: currentLeague.active_week || 1,
        players: currentLeague.players,
        schedule: currentLeague.schedule
      };

      const { data, error } = await db.from('leagues').upsert(payload, { onConflict: 'league_code' });
      if (error) return alert('Save error: ' + error.message);

      alert(`✅ League Synced to Cloud!\nShare Code: ${currentLeague.league_code}`);
      
      const newUrl = `${window.location.pathname}?code=${currentLeague.league_code}`;
      window.history.replaceState(null, '', newUrl);

      updateUI();
      closeDashboardModal();
      fetchLiveScores();
    }

    function copyLeagueLink() {
      navigator.clipboard.writeText(window.location.href);
      const btn = document.getElementById('copyLinkBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = 'Copy Link', 2000);
    }

    function copyWeeklyRosterText() {
      const weekAssignments = currentLeague.schedule[currentLeague.active_week] || {};
      const active = [];
      const bye = [];

      Object.entries(weekAssignments).forEach(([team, player]) => {
        if (!currentWeekActiveTeams.has(team)) {
          bye.push(`${team} (BYE): ${player}`);
        } else {
          active.push(`${team}: ${player}`);
        }
      });

      const totalPot = Number(currentLeague.weekly_dues) + Number(currentLeague.rollover_pot);
      const msg = `🎯 HIT 28 - ${currentLeague.name} (Week ${currentLeague.active_week})\n💰 Current Pot: $${totalPot}\n\n🏈 Active Games:\n${active.join('\n')}\n\n🏖️ On Bye:\n${bye.join('\n') || 'None'}\n\n📊 Live Scoreboard:\n${window.location.href}`;
      navigator.clipboard.writeText(msg);
      const btn = document.getElementById('copyChatBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(() => btn.textContent = 'Copy iMessage', 2000);
    }

    async function fetchLiveScores() {
      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=${currentLeague.active_week}`);
        const data = await res.json();
        const teams = [];
        currentWeekActiveTeams = new Set();
        let allGamesFinal = true;
        let count = 0;

        data.events?.forEach(event => {
          count++;
          const comp = event.competitions?.[0];
          const isFinal = comp?.status?.type?.completed;
          if (!isFinal) allGamesFinal = false;

          const clock = comp?.status?.displayClock || '';
          const period = comp?.status?.period || 0;
          
          comp?.competitors?.forEach(c => {
            const abbr = c.team.abbreviation;
            currentWeekActiveTeams.add(abbr);
            teams.push({
              abbr,
              name: c.team.displayName,
              logo: c.team.logo,
              score: parseInt(c.score || '0', 10),
              isFinal, clock, period
            });
          });
        });

        renderTeams(teams);
        document.getElementById('lastUpdated').textContent = `Cloud Sync: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}`;
      } catch (err) {
        console.error(err);
      }
    }

    function renderTeams(teams) {
      const weekAssignments = currentLeague.schedule[currentLeague.active_week] || {};
      const hits = teams.filter(t => t.score === 28);
      const hunt = teams.filter(t => t.score < 28).sort((a,b) => b.score - a.score);
      const bust = teams.filter(t => t.score > 28);

      const byeGrid = document.getElementById('byeGrid');
      const byeTeamsThisWeek = NFL_TEAMS.filter(t => !currentWeekActiveTeams.has(t));
      byeGrid.innerHTML = byeTeamsThisWeek.map(t => `
        <div class="bg-slate-900/40 border border-slate-800 rounded-lg p-2 flex items-center justify-between text-xs">
          <span class="font-bold text-slate-400">${t}</span>
          <span class="text-[10px] text-amber-300 truncate">${weekAssignments[t] || '-'}</span>
        </div>
      `).join('') || '<div class="text-[11px] text-slate-500 italic col-span-2">No teams on bye this week.</div>';

      hits.forEach(t => {
        if (!celebratedTeams.has(t.abbr)) {
          celebratedTeams.add(t.abbr);
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
      });

      const hitContainer = document.getElementById('targetHitContainer');
      const hitGrid = document.getElementById('targetHitGrid');
      hitGrid.innerHTML = '';
      if (hits.length > 0) {
        hitContainer.classList.remove('hidden');
        hits.forEach(t => {
          hitGrid.innerHTML += `
            <div class="bg-emerald-950/60 border-2 border-emerald-500 rounded-xl p-4 flex items-center justify-between shadow-lg shadow-emerald-950/50">
              <div class="flex items-center gap-3">
                <img src="${t.logo}" class="w-12 h-12 object-contain"/>
                <div>
                  <div class="text-xs font-black text-emerald-300">👑 ${weekAssignments[t.abbr] || 'Unassigned'}</div>
                  <div class="font-bold text-white text-base">${t.name}</div>
                  <div class="text-[10px] text-slate-400">${t.isFinal ? 'FINAL' : 'Q' + t.period + ' ' + t.clock}</div>
                </div>
              </div>
              <div class="text-4xl font-black text-emerald-400">28</div>
            </div>`;
        });
      } else {
        hitContainer.classList.add('hidden');
      }

      const sweatGrid = document.getElementById('sweatGrid');
      sweatGrid.innerHTML = hunt.map(t => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex items-center justify-between hover:border-slate-700 transition">
          <div class="flex items-center gap-3">
            <img src="${t.logo}" class="w-9 h-9 object-contain"/>
            <div>
              <div class="text-[11px] font-bold text-amber-400">${weekAssignments[t.abbr] || 'Unassigned'}</div>
              <div class="font-bold text-white text-sm">${t.abbr}</div>
              <div class="text-[10px] text-slate-400 font-medium">Needs ${28 - t.score} pts</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-2xl font-black text-white">${t.score}</div>
            <div class="text-[10px] text-slate-500 font-mono">${t.isFinal ? 'FINAL' : 'Q' + t.period + ' ' + t.clock}</div>
          </div>
        </div>
      `).join('');

      const bustGrid = document.getElementById('bustedGrid');
      bustGrid.innerHTML = bust.map(t => `
        <div class="bg-slate-900/40 border border-rose-950/60 rounded-lg p-2 flex items-center justify-between">
          <span class="text-xs text-slate-400 line-through font-bold">${t.abbr} <span class="text-[10px] text-slate-500">(${weekAssignments[t.abbr] || '-'})</span></span>
          <span class="text-xs font-bold text-rose-500">${t.score}</span>
        </div>
      `).join('');
    }

    init();
    setInterval(fetchLiveScores, 15000);
  </script>
</body>
</html>
